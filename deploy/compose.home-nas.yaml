services:
  shine-music:
    build:
      context: .
      platforms:
        - linux/amd64
      args:
        GOPROXY: ${SHINE_GOPROXY:-https://goproxy.cn,direct}
        ALPINE_MIRROR: ${SHINE_ALPINE_MIRROR:-https://mirrors.aliyun.com/alpine}
    volumes:
      - /vol1/1000/shine-music/data:/data
      - /vol1/1000/2.Music:/music
      - /vol1/1000/shine-music/libraries:/libraries
      - /vol1/1000/shine-music/cache:/cache
