services:
  shine-music:
    build:
      context: .
      platforms: !override
        - linux/amd64
      args:
        GOPROXY: ${SHINE_GOPROXY:-https://goproxy.cn,direct}
        DEBIAN_MIRROR: ${SHINE_DEBIAN_MIRROR:-https://mirrors.aliyun.com/debian}
        UBUNTU_MIRROR: ${SHINE_UBUNTU_MIRROR:-https://mirrors.aliyun.com/ubuntu}
    volumes:
      - /vol1/1000/shine-music/data:/data
      - /vol1/1000/2.Music:/music
      - /vol1/1000/shine-music/libraries:/libraries
      - /vol1/1000/shine-music/cache:/cache
