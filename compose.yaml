services:
  shine-music:
    build:
      context: .
      platforms:
        - linux/amd64
        - linux/arm64
    image: shine-music:nas
    container_name: shine-music
    restart: unless-stopped
    ports:
      - "${SHINE_HOST_PORT:-8767}:8767"
    environment:
      SHINE_HTTP_PORT: 8767
      SHINE_DATA_DIR: /data
      SHINE_MUSIC_DIR: /music
      SHINE_LIBRARY_DIR: /libraries
      SHINE_CACHE_DIR: /cache
      SHINE_TRASH_RETENTION_DAYS: ${SHINE_TRASH_RETENTION_DAYS:-30}
      SHINE_SCAN_ON_START: ${SHINE_SCAN_ON_START:-true}
      SHINE_LOG_LEVEL: ${SHINE_LOG_LEVEL:-INFO}
    volumes:
      - ${SHINE_DATA_PATH:-./nas-data}:/data
      - ${SHINE_MUSIC_PATH:-./nas-music}:/music
      - ${SHINE_LIBRARIES_PATH:-./nas-libraries}:/libraries
      - ${SHINE_CACHE_PATH:-./nas-cache}:/cache
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8767/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
